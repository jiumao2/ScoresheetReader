name: CI

on:
  push:
  pull_request:

jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_QWEN_LIVE: "0"
      RUN_PRIVATE_MASTER_TEST: "0"
      RUN_PRIVATE_LIVE_UI: "0"
      SCORESHEET_FONT_PATH: ${{ runner.temp }}/scoresheet-fonts/NotoSansSC-VF.ttf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -e './backend[dev]'

      - name: Prepare Chinese PDF font
        shell: bash
        run: |
          mkdir -p "$(dirname "$SCORESHEET_FONT_PATH")"
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/Variable/TTF/Subset/NotoSansSC-VF.ttf' \
            --output "$SCORESHEET_FONT_PATH"
          echo 'd68bafcb48a2707749396aa12bbbd833cb70401f3a9a689fd2902c7e0d295964  '"$SCORESHEET_FONT_PATH" \
            | sha256sum --check --strict

      - name: Install frontend dependencies
        run: npm ci

      - name: Install bundled Chromium
        run: npx playwright install --with-deps chromium

      - name: Python format and lint
        run: |
          python -m ruff format --check backend scripts/private_photo_check.py
          python -m ruff check backend scripts/private_photo_check.py

      - name: Backend tests
        run: python -m pytest backend/tests --cov=backend/scoresheet_reader --cov-fail-under=85

      - name: Frontend unit tests and coverage gate
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Public browser tests
        run: npm run test:e2e
